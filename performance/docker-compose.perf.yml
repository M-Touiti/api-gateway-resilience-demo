# Isolated stack for load tests. Run through performance/run_load_tests.py.
#
# Differs from the root docker-compose.yml on purpose:
#   - No published ports or fixed container names, so it cannot clash with the dev stack.
#   - Fixed CPU and memory limits, so results are comparable between runs.
#   - An optional second gateway (profile "scale") sharing the same Redis.
#   - No Prometheus, Grafana or Redis Commander, which would add noise.

x-gateway: &gateway
  image: gateway-perf/gateway-service:local
  cpus: 2
  mem_limit: ${GW_MEM:-1g}
  restart: unless-stopped
  environment:
    REDIS_HOST: redis
    REDIS_PORT: 6379
    USER_SERVICE_URL: http://user-service:8081
    PAYMENT_SERVICE_URL: http://payment-service:8082
    JWT_SECRET: my-very-secret-key-that-is-at-least-256-bits-long-for-hs256
    # These defaults match the application as shipped, apart from the memory limit.
    LOGGING_LEVEL_COM_DEMO_GATEWAY: ${GW_LOG_LEVEL:-INFO}
    JAVA_TOOL_OPTIONS: ${GW_JAVA_OPTS:-}
    REDIS_TIMEOUT: ${GW_REDIS_TIMEOUT:-200ms}
    MAX_CONCURRENT_REQUESTS_PER_ROUTE: ${GW_MAX_CONCURRENT:-512}
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
    interval: 3s
    timeout: 3s
    retries: 30
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "2"

services:
  redis:
    image: redis:7-alpine
    cpus: 1
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  user-service:
    image: gateway-perf/user-service:local
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    cpus: 4
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  payment-service:
    image: gateway-perf/payment-service:local
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    cpus: 2
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  gateway-service:
    <<: *gateway
    build:
      context: ..
      dockerfile: gateway-service/Dockerfile
    depends_on:
      redis: { condition: service_healthy }
      user-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }

  gateway-2:
    <<: *gateway
    profiles: ["scale"]
    depends_on:
      gateway-service: { condition: service_healthy }
